{{- $password := .Values.password | default (randAlphaNum 24) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app: maas-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-postgresql
  template:
    metadata:
      labels:
        app: maas-postgresql
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: postgresql
        image: {{ .Values.image }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.database }}
        - name: POSTGRES_USER
          value: {{ .Values.username }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maas-db-config
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app: maas-postgresql
spec:
  selector:
    app: maas-postgresql
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: {{ .Values.namespace }}
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DB_CONNECTION_URL: {{ printf "postgres://%s:%s@maas-postgresql.%s.svc:5432/%s?sslmode=disable" .Values.username $password .Values.namespace .Values.database | quote }}
